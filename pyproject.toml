[build-system]
requires = ["hatchling", "build>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "crucible-ai"
version = "0.1.0"
description = "Semantic cache + reverse proxy for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CraftedWithIntent", email = "dev@crafted.ai"}]
keywords = ["llm", "cache", "proxy", "semantic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.104.0",
    "httpx>=0.25.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "uvicorn[standard]>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pyright>=1.1.320",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CraftedWithIntent/crucible-ai"
Repository = "https://github.com/CraftedWithIntent/crucible-ai.git"
Issues = "https://github.com/CraftedWithIntent/crucible-ai/issues"
Documentation = "https://github.com/CraftedWithIntent/crucible-ai#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_ai"]
include = ["src/crucible_ai/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["W293"]

[tool.ruff.lint.isort]
known-first-party = ["crucible_ai"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "tests", ".venv"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
